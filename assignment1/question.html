
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development Quiz</title>

    <link rel="stylesheet" href="question.css">
</head>

<body>

    <!-- Student Details -->
    <div id="quiz-container">

        <h1>Web Development Quiz</h1>

        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <br><br>

        <label>Roll Number:</label>
        <input type="text" id="roll" placeholder="Enter your roll number">
        <br><br>

        <label>Branch:</label>
        <input type="text" id="branch" placeholder="Enter your branch">
        <br><br>

        <button type="button" onclick="startQuiz()">Start Quiz</button>

    </div>


    <!-- Quiz -->
    <div id="quiz" style="display:none;">

        <h1>Web Development Quiz</h1>


        <!-- Question 1 -->
        <div class="question" id="question1">

            <p>1. What does HTML stand for?</p>

            <button onclick="checkAnswer(this, true)">
                Hyper Text Markup Language
            </button>

            <button onclick="checkAnswer(this, false)">
                High Text Machine Language
            </button>

            <button onclick="checkAnswer(this, false)">
                Hyperlink Text Markup Language
            </button>

            <button onclick="checkAnswer(this, false)">
                Home Tool Markup Language
            </button>

            <br><br>

            <button class="next-btn" onclick="nextQuestion(1)">
                Next
            </button>

        </div>


        <!-- Question 2 -->
        <div class="question" id="question2" style="display:none;">

            <p>2. Which language is used to style a webpage?</p>

            <button onclick="checkAnswer(this, false)">
                HTML
            </button>

            <button onclick="checkAnswer(this, true)">
                CSS
            </button>

            <button onclick="checkAnswer(this, false)">
                JavaScript
            </button>

            <button onclick="checkAnswer(this, false)">
                Python
            </button>

            <br><br>

            <button class="next-btn" onclick="nextQuestion(2)">
                Next
            </button>

        </div>


        <!-- Question 3 -->
        <div class="question" id="question3" style="display:none;">

            <p>3. Which language is used to add interactivity to a webpage?</p>

            <button onclick="checkAnswer(this, false)">
                HTML
            </button>

            <button onclick="checkAnswer(this, false)">
                CSS
            </button>

            <button onclick="checkAnswer(this, true)">
                JavaScript
            </button>

            <button onclick="checkAnswer(this, false)">
                SQL
            </button>

            <br><br>

            <button class="next-btn" onclick="nextQuestion(3)">
                Next
            </button>

        </div>


        <!-- Question 4 -->
        <div class="question" id="question4" style="display:none;">

            <p>4. Which HTML tag is used to create a hyperlink?</p>

            <button onclick="checkAnswer(this, false)">
                &lt;p&gt;
            </button>

            <button onclick="checkAnswer(this, true)">
                &lt;a&gt;
            </button>

            <button onclick="checkAnswer(this, false)">
                &lt;h1&gt;
            </button>

            <button onclick="checkAnswer(this, false)">
                &lt;img&gt;
            </button>

            <br><br>

            <button class="next-btn" onclick="submitQuiz()">
                Submit Quiz
            </button>

        </div>


        <!-- Result -->
        <div id="result" style="display:none;">

            <h2>Quiz Completed!</h2>

            <p id="student-info"></p>

            <p id="score"></p>

        </div>

    </div>


    <script src="question.js"></script>

</body>

</html>
